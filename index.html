<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Page</title>
  <style>
    @import url("css/layout.css")
  </style>
  <link href="css/style.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/movableBtn.css" class="css">
  <link rel="stylesheet" href="./css/skill.css" class="css">
  <link rel="stylesheet" href="css/projects.css" class="css">
</head>

<body>
  <button id="toggleNoteApp" class="toggle-btn">Toggle Notes</button>

  <canvas id="cvs"></canvas>
  <div id="movableButton" hx-get="./components/menu/setting.html" hx-target=".popup-content" hx-triggered="click"><img
      src="./img/menu.svg" alt=""></div>
  <div id="popup" class="popup">
    <span class="close" id="closePopup">&times;</span>
    <div class="popup-content">

      <div id="dropInContainer" class="dropInContainer">

      </div>
    </div>
  </div>
  <header>
    <div class="profile-container">
      <img src="/img/331542916_211052708081390_5904850274461385506_n (1).jpg" alt="Profile Picture"
        class="profile-pic" />
      <div class="profile-details">
        <h1 class="name">Cuddly face</h1>
      </div>
    </div>
  </header>
  <main>
    <section class="skills-container">
      <h1 class="heading">languages</h1>
      <div class="skill">
        <p class="name">go lang</p>

        <div class="level-container">
          <div id="goLevel" class="level"></div>
        </div>
        <label id="goLevelNum" class="levelNum" for="level"></label>
      </div>

      <div class="skill">
        <p class="name">javascript</p>
        <div class="level-container">
          <div id="js" class="level"></div>
        </div>
        <label id="jsLevel" class="levelNum" for="js"> </label>
      </div>


      <div class="skill">
        <p class="name">python</p>
        <div class="level-container">
          <div id="py" class="level"></div>
        </div>
        <label id="pyLevel" class="levelNum" for="py"> </label>
      </div>
    </section>
    <section class="work">
      <div class="card">
        <div class="project">
          <div class="img">
            <img class="" src="img/cuddlyFace.jpg" alt="cuddlyFace">
          </div>
          <div class="details">
            <h2 class="project-name">Cuddly face</h2>
            <p project="brief">pretty good</p>
          </div>
          <div class="tools-icon">
            <img class="logo" src="img/logo/css.svg" alt="css3">
            <img class="logo" src="img/logo/node.svg" alt="nodejs">

          </div>
        </div>
      </div>

    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>
        &copy;
        <script>
          document.write(new Date().getFullYear());
        </script>
        Cuddly-face
      </p>
    </div>
  </footer>

  <script src="node_modules/eruda/eruda.js"></script>
  <script>eruda.init();</script>
  <script src="lib/htmx.min.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/ScrollTrigger.min.js"></script>
  <script src="./js/loadingBars.js"></script>
  <script src="/js/app.js"></script>
  <script src="js/particles.js"></script>
</body>

</html>
